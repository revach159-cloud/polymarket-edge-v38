name: Sync prediction history

on:
  schedule:
    # Every 15 minutes — resolve real opens as markets close.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Rebuild history with real heuristic model
        run: npm run sync:history
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/prediction-history.json
          if git diff --staged --quiet; then
            echo "No history changes"
            exit 0
          fi
          git commit -m "chore(history): sync real model prediction history"
          git push origin HEAD:master
          git push origin HEAD:main || true

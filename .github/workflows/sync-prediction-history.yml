name: Sync prediction history

on:
  schedule:
    # Every 30 minutes — keeps נסגרו/צדקנו moving without Supabase.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Rebuild public/prediction-history.json
        run: node scripts/sync-prediction-history.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/prediction-history.json
          if git diff --staged --quiet; then
            echo "No history changes"
            exit 0
          fi
          git commit -m "chore(history): sync prediction-history.json for Production"
          git push origin HEAD:master
          git push origin HEAD:main || true
